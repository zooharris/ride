name: The web version, from the working line

# Web first (27 Nov 2026). The web version is where changes are tried: a push to the web branch publishes it within a
# few minutes, and deploy.yml runs every check on the same pages alongside. The Mac app and TestFlight are made only by
# a release, which is the web line brought onto main.
#
# A push to web starts "kick", which starts this same workflow again on main: the site accepts a publish only from main,
# and "publish" then builds the web branch's pages from there.

on:
  push:
    branches: [web]
    paths-ignore: ['docs/**', 'art/**', '**/*.md']
  workflow_dispatch:

jobs:
  kick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --repo "${{ github.repository }}" --ref main

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Keep the last release's word on the newest app
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          # version.json is what the installed Mac app reads to offer a newer app. A web-only publish must not change it.
          if git clone -q --depth 1 --branch site "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" old 2>/dev/null && [ -f old/version.json ]; then
            cp old/version.json dist/version.json
          fi
          rm -rf old
          cd dist
          git init -q -b site
          git add -A
          git -c user.name="Antogo publishing" -c user.email="actions@users.noreply.github.com" commit -qm "The pages as published"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site
          rm -rf .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
