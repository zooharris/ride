name: Preview of the web version

# The preview (27 Nov 2026): the app as it stands on the preview branch, at <site>/ride/preview/, a few minutes after a
# change is pushed there. It has its own data store and never replaces the public version, which is published only from
# main after every check. The checks still run on the preview branch, in deploy.yml, alongside this.
#
# A push to preview starts "kick", which starts this same workflow again on main: the site accepts a publish only from
# main, and "publish" then builds the preview branch's pages from there.

on:
  push:
    branches: [preview]
    paths-ignore: ['docs/**', 'art/**', '**/*.md']
  workflow_dispatch:

jobs:
  kick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview.yml --repo "${{ github.repository }}" --ref main

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    concurrency:
      group: pages-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ANTOGO_PREVIEW: '1'
      - name: Put the preview beside the public version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch site "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site \
            || { echo "The public version has not been published since the preview was set up, so there is nothing to put the preview beside."; exit 1; }
          test -f site/index.html
          rm -rf site/.git site/preview
          cp -r dist site/preview
          cd site
          git init -q -b site
          git add -A
          git -c user.name="Antogo publishing" -c user.email="actions@users.noreply.github.com" commit -qm "The pages as published"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site
          rm -rf .git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
